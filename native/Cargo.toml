[workspace]
resolver = "3"
members = ["src-tauri", "crates/core", "plugins/nfc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"
repository = "https://github.com/ShauryaKesarwani/GlobalSend"

[workspace.dependencies]
globalsend-core = { path = "crates/core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
