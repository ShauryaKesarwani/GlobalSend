[package]
name = "globalsend-core"
description = "Platform-independent GlobalSend engine: device identity, LAN discovery and transfers. Shared by the Tauri app and the future CLI/TUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
uuid = { version = "1", features = ["v4"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"

[dev-dependencies]
tempfile = "3"
