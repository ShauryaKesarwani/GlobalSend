name: Deploy Backend

on:
  push:
    branches:
      - main

concurrency:
  group: globalsendbackend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            export PATH="$HOME/.bun/bin:$PATH"

            echo ""
            echo "========================================"
            echo "        🚀 GlobalSend Deployment"
            echo "========================================"
            echo ""

            echo "▶ [1/6] Entering project directory..."
            cd /home/ubuntu/projects/GlobalSend/backend
            echo "✓ Working directory: $(pwd)"
            echo ""

            echo "▶ [2/6] Checking Bun..."
            bun --version
            echo "✓ Bun is available"
            echo ""

            echo "▶ [3/6] Pulling latest code..."
            git pull origin main
            echo "✓ Code updated"
            echo ""

            echo "▶ [4/6] Installing dependencies..."
            bun install --frozen-lockfile
            echo "✓ Dependencies installed"
            echo ""

            echo "▶ [5/6] Restarting and checking backend..."
            sudo systemctl restart globalsendbackend.service
            sleep 2

            if ! sudo systemctl is-active --quiet globalsendbackend.service; then
              echo ""
              echo "✗ Backend service failed to start!"
              echo ""
              echo "----- Service Status -----"
              sudo systemctl status globalsendbackend.service --no-pager || true
              echo ""
              echo "----- Recent Logs -----"
              sudo journalctl -u globalsendbackend.service -n 50 --no-pager || true
              exit 1
            fi

            echo "✓ Backend service is running"
            echo ""

            echo "▶ Checking backend health..."

            if ! curl -fsS http://localhost:4000/health; then
              echo ""
              echo "✗ Backend health check failed!"
              echo ""
              echo "----- Service Status -----"
              sudo systemctl status globalsendbackend.service --no-pager || true
              echo ""
              echo "----- Recent Logs -----"
              sudo journalctl -u globalsendbackend.service -n 50 --no-pager || true
              exit 1
            fi

            echo ""
            echo "✓ Backend health check passed"
            echo ""

            echo "▶ [6/6] Checking Tailscale Funnel..."

            if sudo tailscale funnel status | grep -q "4000"; then
              echo "✓ Tailscale Funnel is configured"
            else
              echo "⚠ Funnel is not configured"
              echo "▶ Starting Tailscale Funnel on port 4000..."

              sudo tailscale funnel --bg 4000

              echo "✓ Tailscale Funnel started"
            fi

            echo ""
            echo "========================================"
            echo "        ✓ Deployment Successful"
            echo "========================================"
            echo ""
